name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: LaTeX, for the TikZ and chemfig fragments in the example decks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-science texlive-fonts-recommended dvisvgm ghostscript
          latex --version | head -1 && dvisvgm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Generated docs are up to date
        run: npm run docs && git diff --exit-code docs/REFERENCE.md skills/
      - name: Build the example decks
        run: |
          node bin/aurora.js build examples/demo.tex -o /tmp/demo.html
          node bin/aurora.js build examples/tour/deck.tex -o /tmp/tour.html
          node bin/aurora.js build examples/classic.tex -o /tmp/classic.html
