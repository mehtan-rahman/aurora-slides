# Publishes to npm when a version tag (v0.2.0) is pushed. Needs an NPM_TOKEN repository
# secret (an npm automation token). The build is run with provenance, so npm shows the
# package was built from this repository.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run by hand on a tag: gh workflow run release.yml --ref v0.2.0

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Typecheck and tests only: the strict deck checks need LaTeX, and CI covers them.
      - run: npm run typecheck && npm test
      - name: Check that the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish to npm (skipped when this version is already there)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "aurora-slides@$v" version > /dev/null 2>&1; then echo "aurora-slides@$v is already published"; exit 0; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release (skipped when it already exists)
        run: gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
